<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八曜和茶｜對話點餐</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#19352c;background:#e9eee5}*{box-sizing:border-box}body{margin:0}.shell{max-width:760px;height:100dvh;min-height:540px;margin:auto;background:#fbfaf5;display:flex;flex-direction:column;box-shadow:0 12px 48px #1a3a2a22}header{background:#164937;color:#fff;padding:18px 22px 20px;position:relative;overflow:hidden}header:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff21;border-radius:50%;right:-92px;top:-112px;box-shadow:0 0 0 26px #ffffff08,0 0 0 53px #ffffff08;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:750;color:#c9deb9}header h1{margin:5px 0 4px;font-size:23px;letter-spacing:.03em;position:relative;z-index:1}header p{margin:0;color:#dbeddd;font-size:13px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.table-pill{border:1px solid #ffffff73;border-radius:30px;padding:7px 12px;white-space:nowrap;font-size:13px;background:#ffffff15}.meta{display:flex;align-items:center;justify-content:space-between;background:#f5f0e5;padding:10px 21px;border-bottom:1px solid #e8e0d1;gap:10px;font-size:13px}.meta strong{color:#205940}.room{flex:1;padding:22px 20px 36px;overflow:auto;min-height:0;scroll-behavior:smooth}.day{text-align:center;color:#8a9286;font-size:12px;margin:0 0 20px}.bubble{padding:14px 17px;margin:12px 0;border-radius:17px;max-width:89%;line-height:1.65;white-space:pre-wrap;box-shadow:0 2px 12px #1a3a2a0b;font-size:15px}.bot{background:#fff;border:1px solid #e5e9de;border-top-left-radius:5px}.me{margin-left:auto;background:#dcedd9;border-top-right-radius:5px;color:#184532}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 22px;max-width:590px}.options button{border:1px solid #cbd8c9;color:#1a513b;background:#fff;border-radius:13px;padding:13px 12px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.4;font-family:inherit;text-align:left;box-shadow:0 2px 6px #1a3a2a0b;transition:background .15s,transform .15s,border-color .15s}.options button:hover,.options button:focus-visible{background:#eef6e9;border-color:#387957;transform:translateY(-1px)}.options button:active{transform:translateY(0)}.controls{border-top:1px solid #e8e8df;padding:13px 19px 15px;background:#fff}.controls form{display:flex;gap:8px}input{flex:1;min-width:0;padding:13px;border:1px solid #c9d6c8;border-radius:11px;font-size:14px;background:#fbfcf9}input:focus{outline:2px solid #9ac5a0;outline-offset:1px}button.primary{background:#205b40;border:none;color:white;padding:11px 17px;border-radius:11px;cursor:pointer;font-weight:700;white-space:nowrap}button.primary:hover{background:#154b33}.hint{font-size:11px;color:#667a6b;margin:8px 1px 0}#status{font-size:12px;margin:4px 1px;color:#a33;min-height:1em}@media(max-width:520px){.shell{height:100dvh;min-height:500px}.room{padding:17px 14px 27px}.options{gap:8px}.options button{padding:12px 10px;font-size:13px}.bubble{font-size:14px}.controls{padding:11px 12px 13px}header{padding:16px}header h1{font-size:20px}.meta{padding:9px 15px}}@media(prefers-reduced-motion:reduce){.room{scroll-behavior:auto}.options button{transition:none}}
</style><style>.order-strip{padding:7px 20px;background:#f5f0e5;max-height:112px;overflow:auto;border-bottom:1px solid #e8e0d1}.order-strip[hidden]{display:none}.order-item{padding:3px 0;font-size:13px;font-weight:650}.order-item.pending{color:#715410}.order-item.accepted{color:#225b3d}.order-item.completed{color:#375469}.order-item.cancelled{color:#8b514c}.continue-order{width:100%;margin-top:9px}.continue-order:disabled{background:#aab6ae;cursor:not-allowed}</style></head><body><main class="shell"><header><div class="topline"><div><div class="eyebrow">TEA ORDER · 對話點餐</div><h1 id="name">八曜和茶｜對話點餐</h1></div><span class="table-pill">外帶自取</span></div><p>跟著問題選飲料，完成後由店員確認 · 現場付款</p></header><div class="meta"><span id="stepText">正在載入菜單…</span><strong id="cartInfo">購物車 0 杯 · NT$0</strong></div><div id="orderStrip" class="order-strip" role="status" aria-live="polite" hidden></div><section class="room" id="room" aria-live="polite"><p class="day">開始今天的點餐</p></section><footer class="controls"><form id="ask"><input id="question" maxlength="1000" placeholder="想問推薦？例如：有不含奶的飲料嗎" aria-label="詢問飲料"><button class="primary">問 AI</button></form><button type="button" id="backToOrder" class="primary continue-order" disabled>繼續點餐 ↓</button><p class="hint">點選飲料選項即可點餐；AI 回答只供參考，不會自動送單。</p><p id="status"></p></footer></main><script>
const room=document.querySelector('#room'),status=document.querySelector('#status'),backToOrder=document.querySelector('#backToOrder');let menu=[],cart=[],draft={},stage='start',history=[],busy=false,activeOptions=null;

function updateMeta(){let labels={start:'準備開始',category:'第 1 步 · 選系列',drink:'第 2 步 · 選飲料',sugar:'第 3 步 · 選甜度',ice:'第 4 步 · 選冰熱',quantity:'第 5 步 · 選杯數',summary:'最後一步 · 確認訂單',sending:'訂單送出中',done:'點餐完成'};document.querySelector('#stepText').textContent=labels[stage]||'對話點餐';document.querySelector('#cartInfo').textContent='購物車 '+cart.reduce((n,x)=>n+x.quantity,0)+' 杯 · NT$'+money()}
let trackedOrders=[],checkingStatus=false;
try{let saved=JSON.parse(localStorage.getItem('drink_orders')||'[]');if(Array.isArray(saved))trackedOrders=saved.filter(x=>x&&Number.isInteger(x.id)&&typeof x.token==='string'&&typeof x.status==='string');if(!trackedOrders.length){let old=JSON.parse(localStorage.getItem('drink_last_order')||'null');if(old&&Number.isInteger(old.id)&&typeof old.token==='string')trackedOrders=[old]}}catch{trackedOrders=[]}
function saveOrders(){localStorage.setItem('drink_orders',JSON.stringify(trackedOrders));localStorage.removeItem('drink_last_order')}
const statusNames={pending:'待店員確認',accepted:'已接單，準備製作',completed:'已完成，請取餐',cancelled:'已取消，請洽店員'};
function showOrderStatus(){let strip=document.querySelector('#orderStrip');strip.replaceChildren();strip.hidden=trackedOrders.length===0;for(let order of [...trackedOrders].reverse()){let line=document.createElement('div');line.className='order-item '+order.status;line.textContent='訂單 #'+order.id+' · '+(statusNames[order.status]||order.status);strip.append(line)}}
async function checkOrderStatus(){if(checkingStatus)return;checkingStatus=true;try{for(let current of [...trackedOrders]){if(!['pending','accepted'].includes(current.status))continue;try{let r=await fetch('/api/orders/'+current.id+'/status',{headers:{'X-Order-Token':current.token}});if(r.status===404){trackedOrders=trackedOrders.filter(x=>x!==current);saveOrders();showOrderStatus();continue}if(!r.ok)continue;let d=await r.json();if(!trackedOrders.includes(current))continue;if(d.status!==current.status){current.status=d.status;saveOrders();showOrderStatus();say('訂單 #'+current.id+' 狀態已更新：'+(statusNames[d.status]||d.status))}}catch{}}}finally{checkingStatus=false}}
showOrderStatus();setInterval(checkOrderStatus,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkOrderStatus()});
function say(text,mine=false){let n=document.createElement('div');n.className='bubble '+(mine?'me':'bot');n.textContent=text;room.append(n);room.scrollTop=room.scrollHeight}
function choices(values,callback){let row=document.createElement('div');row.className='options';for(let [label,value] of values){let b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{if(busy)return;row.remove();if(activeOptions===row){activeOptions=null;backToOrder.disabled=true}say(label,true);callback(value)};row.append(b)}room.append(row);activeOptions=row;backToOrder.disabled=false;room.scrollTop=room.scrollHeight}
backToOrder.onclick=()=>{if(!activeOptions||!activeOptions.isConnected)return;activeOptions.scrollIntoView({behavior:'smooth',block:'end'})};
function money(){return cart.reduce((sum,x)=>sum+menu.find(y=>y.id===x.id).price*x.quantity,0)}
function start(){stage='category';updateMeta();say('歡迎！先選一個飲料系列吧。');let cats=[...new Set(menu.map(x=>x.category))];choices(cats.map(x=>[x,x]),category=>drink(category))}
function drink(category){stage='drink';updateMeta();say('你想喝哪一款 '+category+'？');choices([...menu.filter(x=>x.category===category).map(x=>[x.name+' NT$'+x.price,x.id]),['返回系列','back']],id=>{if(id==='back')start();else{draft={id};sugar()}})}
function sugar(){stage='sugar';updateMeta();say('這杯想要什麼甜度？');choices(['無糖','1分糖','3分糖','5分糖','8分糖'].map(x=>[x,x]),x=>{draft.sugar=x;ice()})}
function ice(){stage='ice';updateMeta();say('冰量要怎麼選？');choices(['35%冰','去冰五顆冰','完全去冰','溫','熱'].map(x=>[x,x]),x=>{draft.ice=x;quantity()})}
function quantity(){stage='quantity';updateMeta();say('要幾杯相同的飲料？');choices([1,2,3,4,5].map(x=>[x+' 杯',x]),x=>{cart.push({...draft,quantity:x});summary()})}
function summary(){stage='summary';updateMeta();say('目前訂單：\n'+cart.map(x=>{let drink=menu.find(y=>y.id===x.id);return drink.name+'／'+x.sugar+'／'+x.ice+' × '+x.quantity+' = NT$'+drink.price*x.quantity}).join('\n')+'\n合計 NT$'+money()+'。\n接下來要做什麼？');choices([['再加一杯','add'],['確認送單','confirm'],['清空重選','clear']],async action=>{if(action==='add')start();else if(action==='clear'){cart=[];start()}else await submit()})}
async function submit(){if(busy)return;busy=true;stage='sending';updateMeta();say('正在送出訂單，請稍候……');try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table_no:"外帶自取",items:cart,note:''})});let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'送單失敗');trackedOrders.push({id:d.id,token:d.status_token,status:d.status});saveOrders();showOrderStatus();cart=[];stage='done';updateMeta();say('送單成功！訂單編號 #'+d.id+'，金額 NT$'+d.total+'。請等候店員確認，現場付款。');choices([['再點一筆','again']],()=>start())}catch(e){stage='summary';updateMeta();say('送單未成功：'+e.message+'。請再試一次或請店員協助。');choices([['重新確認訂單','retry']],()=>summary())}finally{busy=false}}
document.querySelector('#ask').onsubmit=async e=>{e.preventDefault();let input=document.querySelector('#question'),message=input.value.trim();if(!message)return;input.value='';say(message,true);status.textContent='AI 正在回答……';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});let d=await r.json();let answer=r.ok?d.reply:d.detail;say(answer);if(r.ok){history.push({role:'user',content:message},{role:'assistant',content:answer});history=history.slice(-8)}}catch{say('連線失敗，請稍後再問或請店員協助。')}finally{status.textContent=''}};
fetch('/api/menu').then(r=>r.json()).then(d=>{menu=d.items;document.querySelector('#name').textContent=d.restaurant+'｜對話點餐';updateMeta();say(d.source_note);start()}).catch(()=>say('菜單載入失敗，請重新整理頁面。'));
</script></body></html>
