<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八曜和茶｜對話點餐</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#1e2930;background:#f1f8f4}*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;min-height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #d6e5da}header{background:#175c49;color:white;padding:19px 22px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#d9f3e8;font-size:13px}.room{flex:1;padding:20px;overflow:auto;min-height:400px;max-height:calc(100vh - 190px)}.bubble{padding:12px 15px;margin:11px 0;border-radius:15px;max-width:88%;line-height:1.55;white-space:pre-wrap}.bot{background:#eaf4ec}.me{margin-left:auto;background:#d9eee6}.options{display:flex;flex-wrap:wrap;gap:8px;margin:7px 0 18px}.options button{border:1px solid #147755;color:#126547;background:#fff;border-radius:100px;padding:10px 14px;cursor:pointer;font-size:15px}.options button:hover{background:#e4f5eb}.controls{border-top:1px solid #ddd;padding:12px;background:#fff}.controls form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;border:1px solid #b9cdc0;border-radius:10px;font-size:15px}button.primary{background:#166449;border:none;color:white;padding:11px 17px;border-radius:10px;cursor:pointer}.hint{font-size:12px;color:#5d7467;margin:8px 0 0}#status{font-size:13px;margin:4px 0;color:#a33}
</style></head><body><main class="shell"><header><h1 id="name">八曜和茶｜對話點餐</h1><p>掃碼點餐・現場付款・由店員確認</p></header><section class="room" id="room" aria-live="polite"></section><footer class="controls"><form id="ask"><input id="question" maxlength="1000" placeholder="也可以問：推薦不含奶的飲料" aria-label="詢問飲料"><button class="primary">詢問 AI</button></form><p class="hint">點選上方選項完成點餐；AI 問答不會自動送出訂單。</p><p id="status"></p></footer></main><script>
const room=document.querySelector('#room'),status=document.querySelector('#status'),table=new URLSearchParams(location.search).get('table')||'A1';let menu=[],cart=[],draft={},stage='start',history=[],busy=false;
function say(text,mine=false){let n=document.createElement('div');n.className='bubble '+(mine?'me':'bot');n.textContent=text;room.append(n);room.scrollTop=room.scrollHeight}
function choices(values,callback){let row=document.createElement('div');row.className='options';for(let [label,value] of values){let b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{if(busy)return;row.remove();say(label,true);callback(value)};row.append(b)}room.append(row);room.scrollTop=room.scrollHeight}
function money(){return cart.reduce((sum,x)=>sum+menu.find(y=>y.id===x.id).price*x.quantity,0)}
function start(){stage='category';say('歡迎！你在 '+table+' 桌。先選一個飲料系列吧。');let cats=[...new Set(menu.map(x=>x.category))];choices(cats.map(x=>[x,x]),category=>drink(category))}
function drink(category){stage='drink';say('你想喝哪一款 '+category+'？');choices([...menu.filter(x=>x.category===category).map(x=>[x.name+' NT$'+x.price,x.id]),['返回系列','back']],id=>{if(id==='back')start();else{draft={id};sugar()}})}
function sugar(){stage='sugar';say('這杯想要什麼甜度？');choices(['無糖','1分糖','3分糖','5分糖','8分糖'].map(x=>[x,x]),x=>{draft.sugar=x;ice()})}
function ice(){stage='ice';say('冰量要怎麼選？');choices(['35%冰','去冰五顆冰','完全去冰','溫','熱'].map(x=>[x,x]),x=>{draft.ice=x;quantity()})}
function quantity(){stage='quantity';say('要幾杯相同的飲料？');choices([1,2,3,4,5].map(x=>[x+' 杯',x]),x=>{cart.push({...draft,quantity:x});summary()})}
function summary(){stage='summary';say('目前訂單：\n'+cart.map(x=>{let drink=menu.find(y=>y.id===x.id);return drink.name+'／'+x.sugar+'／'+x.ice+' × '+x.quantity+' = NT$'+drink.price*x.quantity}).join('\n')+'\n合計 NT$'+money()+'。\n接下來要做什麼？');choices([['再加一杯','add'],['確認送單','confirm'],['清空重選','clear']],async action=>{if(action==='add')start();else if(action==='clear'){cart=[];start()}else await submit()})}
async function submit(){if(busy)return;busy=true;stage='sending';say('正在送出訂單，請稍候……');try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table_no:table,items:cart,note:''})});let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'送單失敗');cart=[];stage='done';say('送單成功！訂單編號 #'+d.id+'，金額 NT$'+d.total+'。請等候店員確認，現場付款。');choices([['再點一筆','again']],()=>start())}catch(e){stage='summary';say('送單未成功：'+e.message+'。請再試一次或請店員協助。');choices([['重新確認訂單','retry']],()=>summary())}finally{busy=false}}
document.querySelector('#ask').onsubmit=async e=>{e.preventDefault();let input=document.querySelector('#question'),message=input.value.trim();if(!message)return;input.value='';say(message,true);status.textContent='AI 正在回答……';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});let d=await r.json();let answer=r.ok?d.reply:d.detail;say(answer);if(r.ok){history.push({role:'user',content:message},{role:'assistant',content:answer});history=history.slice(-8)}}catch{say('連線失敗，請稍後再問或請店員協助。')}finally{status.textContent=''}};
fetch('/api/menu').then(r=>r.json()).then(d=>{menu=d.items;document.querySelector('#name').textContent=d.restaurant+'｜對話點餐';say(d.source_note);start()}).catch(()=>say('菜單載入失敗，請重新整理頁面。'));
</script></body></html>
