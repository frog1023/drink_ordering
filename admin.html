<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店員訂單</title><style>body{font:16px system-ui;max-width:800px;margin:auto;padding:20px}article{border:1px solid #aaa;padding:14px;margin:12px 0;border-radius:8px}button,input,select{padding:8px}</style><h1>店員訂單</h1><p>輸入 .env 中的 ADMIN_TOKEN：</p><input id="token" type="password"><button onclick="load()">載入訂單</button><p id="msg"></p><div id="list"></div><script>
const e=id=>document.getElementById(id),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let r=await fetch('/api/admin/orders',{headers:{'X-Admin-Token':e('token').value}});if(!r.ok){e('msg').textContent='載入失敗：請檢查權杖';return}let data=await r.json();e('msg').textContent='載入 '+data.length+' 筆';e('list').innerHTML=data.map(o=>'<article><b>訂單 #'+o.id+'，桌號 '+safe(o.table_no)+'，NT$'+o.total+'</b><p>'+o.items.map(x=>safe(x.name)+'／'+safe(x.sugar||'未選甜度')+'／'+safe(x.ice||'未選冰量')+' × '+x.quantity).join('、')+'</p><p>備註：'+safe(o.note||'無')+'</p><small>'+safe(o.created_at)+' UTC</small><p><select id="s'+o.id+'"><option value="pending">待確認</option><option value="accepted">已接單</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select> <button onclick="update('+o.id+')">更新</button></p></article>').join('')||'目前無訂單';data.forEach(o=>e('s'+o.id).value=o.status)}async function update(id){let r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':e('token').value},body:JSON.stringify({status:e('s'+id).value})});if(r.ok)load();else e('msg').textContent='更新失敗'}
</script></html>
